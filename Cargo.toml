[package]
name = "falaai-core"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Núcleo criptográfico e de mensagens do FalaAí"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# libsignal: dependência git pinada por commit (ADR-0001). Commit da tag v0.105.4.
# Ao atualizar, igualar rust-toolchain.toml ao arquivo rust-toolchain da libsignal nesse commit.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", rev = "b2a5c30f3245c1bcad04b27b1e752a38321c793d" }
# Mesmas séries da libsignal no commit pinado (rand precisa coincidir para os traits de RNG;
# async-trait e uuid aparecem nas assinaturas dos stores).
async-trait = "0.1.92"
rand = "0.9.4"
uuid = "1.28.0"
# SQLCipher compilado junto. Nas plataformas Apple usa CommonCrypto; nas demais, OpenSSL
# vendorizado (abaixo). A libsignal não usa OpenSSL, então não há conflito de símbolos.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher", "cache"] }
thiserror = "2.0"
zeroize = "1.8.2"
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = ["anyhow", "dart-opaque", "rust-async", "thread-pool"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[features]
# Ganchos para os testes de integração em tests/. Ligada só pela dev-dependency abaixo, então
# nunca entra no build de release nem no mobile.
test-support = []

[dev-dependencies]
falaai-core = { path = ".", features = ["test-support"] }
# Vetores de envelope (tests/envelope_vectors.rs). Mesmas versões que a libsignal já trava.
prost = "0.14.4"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# O codegen do flutter_rust_bridge expande o crate com --cfg frb_expand.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
todo = "warn"

[profile.release]
# A libsignal compila em release com overflow-checks, exceto nos crates de primitivas abaixo.
# Perfis de dependências não se propagam; replicamos aqui.
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.curve25519-dalek]
overflow-checks = false

[profile.release.package.sha2]
overflow-checks = false

[profile.release.package.hmac]
overflow-checks = false
