[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro de build (sem código em runtime) puxado pela libsignal: libcrux-ml-kem -> hax-lib.
  # Sem versão corrigida e sem como trocar sem fork (ADR-0001). Remover quando a libsignal migrar.
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 sem manutenção; transitivo da libsignal, só em build" },
  # bincode sem manutenção (aviso, não vulnerabilidade), puxado pelo zkgroup da libsignal, de onde
  # vem a unidentified access key do sealed sender. Mesmo caso: sem troca sem fork (ADR-0001).
  { id = "RUSTSEC-2025-0141", reason = "bincode sem manutenção; transitivo do zkgroup da libsignal" },
]

[licenses]
version = 2
# A libsignal é AGPL-3.0; o crate também. Licenças permissivas são compatíveis.
allow = [
  "AGPL-3.0-only", "AGPL-3.0-or-later",
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0",
  # webpki-roots: a lista de CAs raiz da Mozilla, dados e não código. Licença permissiva.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# As listas já preveem as dependências da libsignal; não avisar enquanto ela não entra.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "allow"
allow-git = ["https://github.com/signalapp/libsignal", "https://github.com/signalapp/SparsePostQuantumRatchet", "https://github.com/signalapp/boring", "https://github.com/signalapp/curve25519-dalek"]
